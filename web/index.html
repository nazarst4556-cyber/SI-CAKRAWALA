<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">
  <script>
    // Universal dynamic base href: handles GitHub Pages repo subpath (/SI-CAKRAWALA/)
    // as well as custom root domain (https://cakrawala-siber.id/) and localhost
    (function () {
      var base = document.querySelector('base');
      if (base) {
        if (window.location.hostname.endsWith('github.io')) {
          var segments = window.location.pathname.split('/').filter(Boolean);
          if (segments.length > 0) {
            base.setAttribute('href', '/' + segments[0] + '/');
            return;
          }
        }
        base.setAttribute('href', '/');
      }
    })();
  </script>

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="A new Flutter project.">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="siber">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>siber</title>
  <link rel="manifest" href="manifest.json">
</head>
<body>
  <!-- Three.js Library & SI-CAKRAWALA Tactical 3D Globe -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="tactical_globe.js"></script>

  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
